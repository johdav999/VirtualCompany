<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#f8fafc"/><rect x="0" y="0" width="18" height="100%" fill="#2563eb"/><text x="72" y="110" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0f172a">Slide 3</text><text x="82" y="200" font-family="Arial, sans-serif" font-size="28" fill="#334155">Starting with Wellheld 01 Company workspace Add the company details,</text><text x="82" y="242" font-family="Arial, sans-serif" font-size="28" fill="#334155">goals, working policies and the information Wellheld may use. 02 AI team</text><text x="82" y="284" font-family="Arial, sans-serif" font-size="28" fill="#334155">and limits Choose the specialist roles you need, then define approval</text><text x="82" y="326" font-family="Arial, sans-serif" font-size="28" fill="#334155">points and operating boundaries. 03 First priorities Connect the</text><text x="82" y="368" font-family="Arial, sans-serif" font-size="28" fill="#334155">relevant sources and review the first recommended work before expanding</text><text x="82" y="410" font-family="Arial, sans-serif" font-size="28" fill="#334155">further. Most teams begin with one area and expand after the first</text><text x="82" y="452" font-family="Arial, sans-serif" font-size="28" fill="#334155">operating rhythm is established. 03</text><text x="1510" y="855" text-anchor="end" font-family="Arial, sans-serif" font-size="22" fill="#64748b">3</text></svg>