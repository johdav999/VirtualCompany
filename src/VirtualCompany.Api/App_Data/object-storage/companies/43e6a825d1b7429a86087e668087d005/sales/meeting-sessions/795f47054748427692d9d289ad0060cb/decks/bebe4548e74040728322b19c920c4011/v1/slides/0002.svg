<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#f8fafc"/><rect x="0" y="0" width="18" height="100%" fill="#2563eb"/><text x="72" y="110" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0f172a">Slide 2</text><text x="82" y="200" font-family="Arial, sans-serif" font-size="28" fill="#334155">One operating team, clear human control What you can do Run finance,</text><text x="82" y="242" font-family="Arial, sans-serif" font-size="28" fill="#334155">sales, marketing and support from one shared operating view. Review</text><text x="82" y="284" font-family="Arial, sans-serif" font-size="28" fill="#334155">source evidence and approve consequential actions before they leave the</text><text x="82" y="326" font-family="Arial, sans-serif" font-size="28" fill="#334155">company. Let specialist agents prepare work and coordinate handoffs</text><text x="82" y="368" font-family="Arial, sans-serif" font-size="28" fill="#334155">while you retain the right to pause or take control. Business value</text><text x="82" y="410" font-family="Arial, sans-serif" font-size="28" fill="#334155">Fewer missed priorities. Faster evidence-backed decisions. More</text><text x="82" y="452" font-family="Arial, sans-serif" font-size="28" fill="#334155">operating capacity with visible limits. 02</text><text x="1510" y="855" text-anchor="end" font-family="Arial, sans-serif" font-size="22" fill="#64748b">2</text></svg>